server:
  listen: "127.0.0.1:8787"

discovery:
  includeNamePrefixes:
    - "vsc-"
  includeLabels:
    t3code.enabled: "true"
  # Optional. When set, DCM attaches each running detected devcontainer to this
  # existing Docker network and prefers that network IP for container access.
  connectToNetwork: ""

defaults:
  containerUser: vscode
  containerHome: /home/vscode

t3:
  enabled: true
  port: 3773
  autoIssueBackendToken: true
  serverCommand:
    - t3
    - serve
    - --host
    - 0.0.0.0
    - --port
    - "3773"

pairingTokens:
  # Optional. When set, DCM persists browser bearer tokens issued by the
  # pairing dance so paired dashboard/API clients survive DCM restarts.
  postgresUrl: ""
  # postgresUrl: "postgres://devcontainer_manager:devcontainer_manager@localhost:5432/devcontainer_manager?sslmode=disable"

sync:
  enabled: true
  defaults:
    ignoreVCS: true
    ignores:
      - .DS_Store
    permissions:
      defaultFileMode: "0644"
      defaultDirectoryMode: "0755"

rules:
  - name: default
    match: {}
    t3:
      enabled: true
    syncs:
      - mode: push
        manager: "/sync/gitconfig"
        container: "/home/vscode/.gitconfig"
