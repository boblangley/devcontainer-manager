name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Go packages
        run: go test ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Build manager
        run: go build ./cmd/devcontainer-manager

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: devcontainer-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Devcontainer discovery smoke test
        run: ./test/integration/devcontainer_cli_smoke.sh
