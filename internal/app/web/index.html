<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Devcontainer Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              border: "hsl(214.3 31.8% 91.4%)",
              input: "hsl(214.3 31.8% 91.4%)",
              ring: "hsl(222.2 84% 4.9%)",
              background: "hsl(0 0% 100%)",
              foreground: "hsl(222.2 84% 4.9%)",
              muted: "hsl(210 40% 96.1%)",
              "muted-foreground": "hsl(215.4 16.3% 46.9%)",
              card: "hsl(0 0% 100%)",
              "card-foreground": "hsl(222.2 84% 4.9%)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <main class="mx-auto flex min-h-screen max-w-7xl flex-col gap-6 px-4 py-6 sm:px-6 lg:px-8">
      <header class="flex flex-col gap-4 border-b border-border pb-5 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-medium text-muted-foreground">Local Docker inventory</p>
          <h1 class="text-3xl font-semibold tracking-normal">Devcontainer Manager</h1>
        </div>
        <div class="flex items-center gap-2">
          <button id="refresh" class="inline-flex h-9 items-center rounded-md border border-border bg-background px-3 text-sm font-medium shadow-sm hover:bg-muted">Refresh</button>
          <span id="health" class="inline-flex h-9 items-center rounded-md border border-border px-3 text-sm text-muted-foreground">Checking</span>
        </div>
      </header>

      <section class="grid gap-3 sm:grid-cols-3">
        <div class="rounded-lg border border-border bg-card p-4 shadow-sm">
          <p class="text-sm text-muted-foreground">Devcontainers</p>
          <p id="container-count" class="mt-2 text-2xl font-semibold">0</p>
        </div>
        <div class="rounded-lg border border-border bg-card p-4 shadow-sm">
          <p class="text-sm text-muted-foreground">T3 environments</p>
          <p id="environment-count" class="mt-2 text-2xl font-semibold">0</p>
        </div>
        <div class="rounded-lg border border-border bg-card p-4 shadow-sm">
          <p class="text-sm text-muted-foreground">Sync sessions</p>
          <p id="session-count" class="mt-2 text-2xl font-semibold">0</p>
        </div>
      </section>

      <div class="flex gap-2 border-b border-border">
        <button data-tab="containers" class="tab -mb-px border-b-2 border-foreground px-3 py-2 text-sm font-medium">Containers</button>
        <button data-tab="sessions" class="tab -mb-px border-b-2 border-transparent px-3 py-2 text-sm font-medium text-muted-foreground">Sessions</button>
      </div>

      <section id="containers-panel" class="overflow-hidden rounded-lg border border-border bg-card shadow-sm">
        <div class="overflow-x-auto">
          <table class="w-full min-w-[960px] text-left text-sm">
            <thead class="border-b border-border bg-muted/60 text-xs uppercase text-muted-foreground">
              <tr>
                <th class="px-4 py-3 font-medium">Container</th>
                <th class="px-4 py-3 font-medium">Rule</th>
                <th class="px-4 py-3 font-medium">Workspace</th>
                <th class="px-4 py-3 font-medium">User</th>
                <th class="px-4 py-3 font-medium">T3</th>
                <th class="px-4 py-3 font-medium">Sync</th>
                <th class="px-4 py-3 font-medium">Pairing</th>
              </tr>
            </thead>
            <tbody id="containers" class="divide-y divide-border"></tbody>
          </table>
        </div>
      </section>

      <section id="sessions-panel" class="hidden overflow-hidden rounded-lg border border-border bg-card shadow-sm">
        <div class="overflow-x-auto">
          <table class="w-full min-w-[920px] text-left text-sm">
            <thead class="border-b border-border bg-muted/60 text-xs uppercase text-muted-foreground">
              <tr>
                <th class="px-4 py-3 font-medium">Session</th>
                <th class="px-4 py-3 font-medium">Mode</th>
                <th class="px-4 py-3 font-medium">Status</th>
                <th class="px-4 py-3 font-medium">Alpha</th>
                <th class="px-4 py-3 font-medium">Beta</th>
              </tr>
            </thead>
            <tbody id="sessions" class="divide-y divide-border"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const state = { containers: [], environments: [], sessions: [] };
      const badge = (text, tone = "default") => {
        const tones = {
          default: "border-border bg-muted text-foreground",
          ok: "border-emerald-200 bg-emerald-50 text-emerald-700",
          warn: "border-amber-200 bg-amber-50 text-amber-700",
          bad: "border-red-200 bg-red-50 text-red-700",
        };
        return `<span class="inline-flex items-center rounded-md border px-2 py-1 text-xs font-medium ${tones[tone] || tones.default}">${escapeHtml(text || "unknown")}</span>`;
      };
      const tone = (value) => {
        if (["ready", "ok"].includes(value)) return "ok";
        if (["disabled", "idle", "stopped", "paused"].includes(value)) return "default";
        if (["not-ready", "ready-no-token", "mutagen-daemon-unavailable"].includes(value)) return "warn";
        return value ? "bad" : "default";
      };
      async function load() {
        const [health, containers, envs, sessions] = await Promise.all([
          fetch("/healthz").then((r) => r.ok),
          fetch("/api/containers").then((r) => r.json()),
          fetch("/api/environments").then((r) => r.json()),
          fetch("/api/sessions").then((r) => r.json()),
        ]);
        state.containers = containers.containers || [];
        state.environments = envs.environments || [];
        state.sessions = sessions.sessions || [];
        document.querySelector("#health").textContent = health ? "Healthy" : "Unhealthy";
        document.querySelector("#container-count").textContent = state.containers.length;
        document.querySelector("#environment-count").textContent = state.environments.length;
        document.querySelector("#session-count").textContent = state.sessions.length;
        renderContainers();
        renderSessions();
      }
      function renderContainers() {
        document.querySelector("#containers").innerHTML = state.containers.map((c) => `
          <tr class="align-top">
            <td class="px-4 py-3">
              <div class="font-medium">${escapeHtml(c.name)}</div>
              <div class="mt-1 font-mono text-xs text-muted-foreground">${escapeHtml(c.shortId)}</div>
            </td>
            <td class="px-4 py-3">${badge(c.rule || "no match")}</td>
            <td class="max-w-sm px-4 py-3">
              <div class="truncate" title="${escapeHtml(c.localFolder || c.workspace || "")}">${escapeHtml(c.localFolder || c.workspace || "unknown")}</div>
              <div class="mt-1 text-xs text-muted-foreground">${escapeHtml(c.composeService || "")}</div>
            </td>
            <td class="px-4 py-3">
              <div>${escapeHtml(c.containerUser || "unknown")}</div>
              <div class="mt-1 text-xs text-muted-foreground">${escapeHtml(c.containerHome || "")}</div>
            </td>
            <td class="px-4 py-3">
              ${badge(c.t3?.status || "disabled", tone(c.t3?.status))}
              ${c.t3?.httpBaseUrl ? `<a class="mt-2 block truncate text-xs text-blue-700 hover:underline" href="${escapeHtml(c.t3.httpBaseUrl)}">${escapeHtml(c.t3.httpBaseUrl)}</a>` : ""}
              ${c.t3?.error ? `<div class="mt-1 text-xs text-red-700">${escapeHtml(c.t3.error)}</div>` : ""}
            </td>
            <td class="px-4 py-3">
              ${badge(c.sync?.status || "disabled", tone(c.sync?.status))}
              <div class="mt-1 text-xs text-muted-foreground">${c.sync?.sessions || 0} sessions</div>
            </td>
            <td class="px-4 py-3">
              ${c.t3?.environmentId ? `<button data-pair="${escapeHtml(c.t3.environmentId)}" class="pair inline-flex h-8 items-center rounded-md border border-border px-2 text-xs font-medium hover:bg-muted">Pairing code</button>` : ""}
              <div id="pair-${escapeHtml(c.t3?.environmentId || "")}" class="mt-2 font-mono text-xs"></div>
            </td>
          </tr>
        `).join("");
        document.querySelectorAll(".pair").forEach((button) => {
          button.addEventListener("click", async () => {
            const id = button.dataset.pair;
            const result = await fetch(`/api/environments/${id}/pairing-code`, { method: "POST" }).then((r) => r.json());
            document.querySelector(`#pair-${CSS.escape(id)}`).textContent = result.pairingCode || "failed";
          });
        });
      }
      function renderSessions() {
        document.querySelector("#sessions").innerHTML = state.sessions.map((s) => `
          <tr class="align-top">
            <td class="px-4 py-3">
              <div class="font-medium">${escapeHtml(s.name)}</div>
              <div class="mt-1 font-mono text-xs text-muted-foreground">${escapeHtml((s.containerId || "").slice(0, 12))}</div>
            </td>
            <td class="px-4 py-3">${badge(s.mode)}</td>
            <td class="px-4 py-3">${badge(s.status, tone(s.status))}${s.error ? `<div class="mt-1 text-xs text-red-700">${escapeHtml(s.error)}</div>` : ""}</td>
            <td class="max-w-xs px-4 py-3"><div class="truncate font-mono text-xs" title="${escapeHtml(s.alpha || "")}">${escapeHtml(s.alpha || "")}</div></td>
            <td class="max-w-xs px-4 py-3"><div class="truncate font-mono text-xs" title="${escapeHtml(s.beta || "")}">${escapeHtml(s.beta || "")}</div></td>
          </tr>
        `).join("");
      }
      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch]));
      }
      document.querySelector("#refresh").addEventListener("click", load);
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          const selected = tab.dataset.tab;
          document.querySelectorAll(".tab").forEach((item) => {
            item.classList.toggle("border-foreground", item.dataset.tab === selected);
            item.classList.toggle("border-transparent", item.dataset.tab !== selected);
            item.classList.toggle("text-muted-foreground", item.dataset.tab !== selected);
          });
          document.querySelector("#containers-panel").classList.toggle("hidden", selected !== "containers");
          document.querySelector("#sessions-panel").classList.toggle("hidden", selected !== "sessions");
        });
      });
      load();
      setInterval(load, 5000);
    </script>
  </body>
</html>
